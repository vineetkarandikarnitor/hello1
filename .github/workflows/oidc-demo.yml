name: OIDC PoC - Cross-org PR (safe push)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no default creds)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create GitHub App installation token (target org/repo)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: demo-org-oidc-3
          repositories: test-org-oidc-3

      # Clone the TARGET repo with the app token (so histories align)
      - name: Clone target repo (shallow)
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${APP_TOKEN}@github.com/demo-org-oidc-3/test-org-oidc-3.git target
          cd target
          git config user.name "github-app[bot]"
          git config user.email "github-app[bot]@users.noreply.github.com"

      # Make your change INSIDE the target repo clone
      - name: Create branch and commit inside target repo
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd target
          git checkout -b oidc-change-branch-2
          echo "OIDC PR Change $(date)" >> example.txt
          git add example.txt
          git commit -m "OIDC PoC: Update example.txt"
          git push origin oidc-change-branch-2

      - name: Open PR on target repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --repo demo-org-oidc-3/test-org-oidc-3 \
            --title "OIDC PoC PR" \
            --body "Created from cross-org OIDC flow (inside target clone)" \
            --head oidc-change-branch-2 \
            --base main
